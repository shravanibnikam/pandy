packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  # Fetch a platform-specific binary in postinstall.
  esbuild: true
  electron: true
  # vsce's signing helper, needed to produce a .vsix.
  "@vscode/vsce-sign": true
  # Pulled in by vsce for credential storage during publish. Not needed to
  # build or package, and it compiles native code, so leave it unbuilt.
  keytar: false
