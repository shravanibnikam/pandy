<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Sandboxed renderer with no remote content of any kind. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="renderer.css">
  <title>Pandy</title>
</head>
<body data-route="widget">
  <!-- The widget: just the mascot, draggable, no chrome. -->
  <div id="widget" class="widget">
    <canvas id="mascot" width="64" height="64" role="img" aria-label="Pandy the panda"></canvas>
    <div id="bubble" class="bubble" role="status" aria-live="polite" hidden></div>
    <div id="actions" class="actions" role="group" aria-label="Reminder actions" hidden>
      <button type="button" data-result="completed">Done</button>
      <button type="button" data-result="snoozed">Snooze</button>
      <button type="button" data-result="paused">Pause</button>
    </div>
  </div>

  <!-- Settings and onboarding share the window; only one route is ever shown. -->
  <main id="panel" class="panel" hidden></main>

  <script src="renderer.js"></script>
</body>
</html>
