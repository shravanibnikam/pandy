<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Sandboxed renderer, no remote content. media-src 'self' is required or the
    sound cues are blocked outright by default-src 'none'.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; media-src 'self'; font-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="renderer.css">
  <title>Pandy</title>
</head>
<body data-route="widget">
  <!--
    The widget stacks vertically: bubble, [mascot + control], actions.
    Everything stays inside the window bounds — a frameless window clips
    anything positioned outside it, so the buttons must be laid out in flow.
    Main grows the window when a reminder appears and shrinks it afterwards.
  -->
  <div id="widget" class="widget">
    <div id="bubble" class="bubble" role="status" aria-live="polite" hidden></div>

    <div class="mascot-row">
      <canvas id="mascot" width="64" height="64" role="img" aria-label="Pandy the panda"></canvas>
      <!--
        The one always-visible way into settings. It is a no-drag island inside
        the drag region, so dragging Pandy never trips it.
      -->
      <button id="heart" class="heart" type="button" title="Open Pandy settings">
        <span aria-hidden="true" class="heart-glyph">♥</span>
        <span class="sr-only">Open Pandy settings</span>
      </button>
    </div>

    <div id="actions" class="actions" role="group" aria-label="Reminder actions" hidden>
      <button type="button" data-result="completed">Done</button>
      <button type="button" data-result="snoozed">Snooze</button>
      <button type="button" data-result="paused">Pause</button>
    </div>
  </div>

  <!-- Settings and onboarding share the window; only one route is ever shown. -->
  <main id="panel" class="panel" hidden></main>

  <script src="renderer.js"></script>
</body>
</html>
